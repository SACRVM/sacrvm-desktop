<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACRVM DESKTOP</title>
    <meta name="description" content="A web desktop you fill yourself: paste a repo URL, the app installs. Zero dependencies, zero build — apps are web components, the desktop is one page.">

    <meta property="og:title" content="SACRVM DESKTOP">
    <meta property="og:description" content="A web desktop you fill yourself: paste a repo URL, the app installs.">
    <meta property="og:url" content="https://desktop.sacrvm.dev/">
    <meta property="og:type" content="website">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/><polyline points='3.27 6.96 12 12.01 20.73 6.96'/><line x1='12' y1='22.08' x2='12' y2='12'/></svg>">

    <link rel="stylesheet" href="kit/css/ui.css">
    <link rel="stylesheet" href="desktop.css">

    <!-- The kit is vendored: this repo owns a copy of kit/ and upgrades when
         it chooses. A desktop hosts apps it does not know in advance, so it
         loads the whole kit rather than cherry-picking. -->
    <script defer src="kit/js/all.js"></script>
    <script defer src="desktop.js"></script>
</head>
<body class="app-page">
    <!-- ONE stage, and the apps on it are COMPLETE: each draws its own
         chrome. The desktop owns only its home section — ribbon included —
         and the bare stage; on stage it is present through context.host,
         rendered by the app in its own nav. -->
    <div class="app-stage" id="app-stage">
        <!-- Shown at "#/", hidden while a view app is on stage. The ribbon
             is the home's chrome, so it lives and dies with it — and it
             stays quiet: two icon buttons, no chrome competing with the
             apps. Installing lives in the grid, where the apps are. -->
        <div id="app-home" class="app-home">
            <sac-nav brand="SACRVM" brand-icon="cube" brand-href="#/" app-name="DESKTOP">
                <div slot="toolbar" class="toolbar">
                    <!-- Only there once somebody said who they are: anonymous is the
                         default, and an empty badge would be chrome about nothing. -->
                    <button class="nav-icon-btn who-btn" id="me-btn" hidden title="You" aria-label="You">
                        <sac-avatar id="me-avatar" style="--avatar-size: 26px"></sac-avatar>
                    </button>
                    <button class="nav-icon-btn" id="info-btn" title="How this works" aria-label="How this works">
                        <sac-icon name="info"></sac-icon>
                    </button>
                    <button class="nav-icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
                        <sac-icon name="settings"></sac-icon>
                    </button>
                </div>
            </sac-nav>

            <div class="orb"></div>

            <div class="hub-container">
                <header>
                    <h1>SACRVM DESKTOP</h1>
                    <p class="intro-text">
                        A desktop you fill yourself. Paste the URL of an app repository and it
                        is installed — the desktop remembers where the app lives, never a copy
                        of it. Make it yours in <strong>Settings</strong>, or read
                        <strong>how this works</strong> — both up in the ribbon.
                    </p>
                </header>

                <!-- Apps, then the install tile that closes the row.
                     desktop.js keeps that tile last on every render. -->
                <main class="grid" id="tiles"></main>
            </div>

            <sac-footer brand="SACRVM DESKTOP"
                        link-href="https://github.com/SACRVM/sacrvm-desktop" link-label="GITHUB"></sac-footer>
        </div>
        <!-- View apps are appended here by sac.apps. -->
    </div>

    <sac-command-palette></sac-command-palette>
</body>
</html>
