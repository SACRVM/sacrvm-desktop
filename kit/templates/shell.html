<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Suite</title>
    <!-- Adjust the path to wherever kit/ lives relative to this page. -->
    <link rel="stylesheet" href="../kit/css/ui.css">

    <!-- A shell hosts apps it does not know in advance, so the autoloader
         earns its keep here. Cherry-pick instead if your app list is fixed. -->
    <script defer src="../kit/js/all.js"></script>
</head>
<body class="app-page">
    <!-- ONE hub: the ribbon, the rail and the stage belong to the shell.
         Everything else is an app that runs ON the stage. -->
    <sac-nav brand="MY SUITE" brand-icon="cube" brand-href="#/">
        <div slot="context"><sac-theme-toggle></sac-theme-toggle></div>
    </sac-nav>

    <div class="workspace">
        <div class="main-layout">
            <!-- Renders whatever the app on stage projects through
                 context.sidebar; hides itself while nothing is projected. -->
            <sac-sidebar></sac-sidebar>

            <div class="app-stage" id="app-stage">
                <!-- Shown at "#/", hidden while a view app is on stage. -->
                <div id="app-home">
                    <div class="orb"></div>
                    <div class="hub-container">
                        <header>
                            <h1>MY SUITE</h1>
                            <p class="intro-text">One line about the suite.</p>
                        </header>
                        <main class="grid">
                            <!-- A view app is addressed by hash, so a plain link
                                 opens it — no click handler in the way. -->
                            <a class="tile" href="#/notes">
                                <sac-icon name="note"></sac-icon>
                                <div>
                                    <h2>Notes</h2>
                                    <p>What it does, in one sentence.</p>
                                </div>
                            </a>
                            <!-- A window app opens in place; [data-app] binds it. -->
                            <a class="tile tile-window" href="?app=timer" data-app="timer">
                                <sac-icon name="clock"></sac-icon>
                                <div>
                                    <h2>Timer</h2>
                                    <p>Small tool, lives in a floating window.</p>
                                </div>
                            </a>
                        </main>
                    </div>
                    <sac-footer brand="MY SUITE" version="1.0.0"></sac-footer>
                </div>
                <!-- View apps are appended here by sac.apps. -->
            </div>
        </div>
    </div>

    <sac-command-palette></sac-command-palette>

    <script defer>
        // all.js injects its scripts, and injected scripts do not hold up
        // DOMContentLoaded — boot on the autoloader's readiness signal. With
        // cherry-picked <script defer> tags, DOMContentLoaded is fine.
        function boot() {
            // kind:"view" — the app takes over the stage. Addressed at
            // "#/<id>", listed in the nav panel automatically, and it projects
            // its own navigation into the rail via context.sidebar.
            sac.apps.register({
                id:          "notes",
                name:        "Notes",
                icon:        "note",
                description: "What it does, in one or two sentences.",
                kind:        "view",
                tag:         "app-notes",
                src:         "notes/app.js",
                // accent:   "#10b981",   // optional per-app accent
            });

            // kind:"window" — floats above the shell.
            sac.apps.register({
                id:     "timer",
                name:   "Timer",
                icon:   "clock",
                kind:   "window",
                tag:    "app-timer",
                src:    "timer/app.js",
                width:  "420px",
                height: "320px",
            });

            // viewHost: where view apps mount. home: shown while none is open.
            sac.apps.init({ viewHost: "#app-stage", home: "#app-home" });
        }

        if (window.sacReady) boot();
        else document.addEventListener("sac:ready", boot, { once: true });
    </script>
</body>
</html>
